<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Rádio Atalaia Notícias</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#000;}
.player-full{width:100%;height:100%;display:flex;justify-content:center;align-items:center;background:linear-gradient(180deg,#000,#111);}
.player-box{width:100%;max-width:420px;text-align:center;padding:25px;}
.logo{width:160px;height:160px;margin:0 auto 20px;border-radius:50%;border:4px solid #e50914;overflow:hidden;}
.logo img{width:100%;height:100%;object-fit:cover;}
h1{color:#fff;font-size:22px;margin-bottom:5px;}
p{color:#aaa;font-size:14px;}
.equalizer{display:none;justify-content:center;gap:5px;margin:25px 0;}
.equalizer span{width:6px;height:22px;background:#e50914;animation:anim 1s infinite ease-in-out;}
.equalizer span:nth-child(2){animation-delay:.1s;}
.equalizer span:nth-child(3){animation-delay:.2s;}
.equalizer span:nth-child(4){animation-delay:.3s;}
.equalizer span:nth-child(5){animation-delay:.4s;}
@keyframes anim{0%,100%{height:6px}50%{height:24px}}
.controls{display:flex;justify-content:center;gap:25px;}
.controls button{width:65px;height:65px;border-radius:50%;border:none;font-size:24px;color:#fff;background:#e50914;cursor:pointer;}
.volume{margin-top:20px;}
.volume input{width:100%;}
.status{margin-top:15px;font-size:13px;color:#0f0;}
</style>
</head>
<body>

<div class="player-full">
  <div class="player-box">
    <div class="logo">
      <img src="https://i.imgur.com/kCm5fFT.png" alt="Logo Rádio">
    </div>

    <h1>Rádio Atalaia Notícias</h1>
    <p>Os Fatos que Você Precisa Saber</p>

    <div class="equalizer" id="eq">
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="controls">
      <button onclick="playRadio()"><i class="fas fa-play"></i></button>
      <button onclick="stopRadio()"><i class="fas fa-stop"></i></button>
    </div>

    <div class="volume">
      <input type="range" min="0" max="1" step="0.01" value="0.8" onchange="player.volume=this.value">
    </div>

    <div class="status" id="status">🔴 Offline</div>

    <audio id="player" preload="none" playsinline>
      <source src="https://stream.zeno.fm/xrp5m5g6ztzuv" type="audio/mpeg">
    </audio>
  </div>
</div>

<script>
// PWA Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}

const player = document.getElementById("player");
const status = document.getElementById("status");
const eq = document.getElementById("eq");

function playRadio() {
  player.play().then(()=>{
    status.innerHTML = "🟢 AO VIVO";
    eq.style.display = "flex";
  }).catch(()=>{
    status.innerHTML = "❌ Erro ao iniciar";
  });
}

function stopRadio() {
  player.pause();
  player.currentTime = 0;
  status.innerHTML = "⏹️ Parado";
  eq.style.display = "none";
}
</script>

</body>
</html>


<!-- Botão PWA estilo IEB, inline e isolado -->
<button id="installBtn" style="
  background-color:#e60000;
  color:white;
  border:none;
  border-radius:5px;
  padding:12px 20px;
  font-weight:bold;
  cursor:pointer;
  font-size:16px;
  display:inline-block;
">📱 Instalar Rádio Portal Atalaia</button>

<script>
let deferredPrompt;
const installBtn = document.getElementById('installBtn');

// Detecta se o navegador suporta PWA e dispara o evento
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault(); // previne o prompt automático
  deferredPrompt = e;
  installBtn.style.display = 'inline-block'; // garante que o botão fique visível
});

// Ao clicar no botão, dispara o prompt de instalação do PWA
installBtn.addEventListener('click', async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const choice = await deferredPrompt.userChoice;
    if(choice.outcome === 'accepted'){
      console.log('Usuário aceitou instalar o app!');
    } else {
      console.log('Usuário rejeitou instalar o app.');
    }
    deferredPrompt = null;
  } else {
    // Caso o navegador não suporte PWA, apenas mantém o botão visível
    alert('Seu navegador não suporta instalação de aplicativo. Acesse pelo Chrome no Android para instalar.');
  }
});
</script>
